# Traefik · Reverse proxy + TLS automático para Docker Swarm
#
# Listens en host:80 y host:443, descubre servicios por labels y genera
# certificados gratis con Let's Encrypt (challenge HTTP-01).
#
# Deploy (después de crear la red — ver deploy/README.md):
#   docker stack deploy -c deploy/traefik-stack.yml traefik

services:
  traefik:
    image: traefik:v3.1
    command:
      # === Provider Swarm: descubre servicios con labels traefik.* ===
      - --providers.swarm=true
      - --providers.swarm.exposedByDefault=false
      - --providers.swarm.network=vitalia-net

      # === Entrypoints ===
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443

      # === Redirección global HTTP → HTTPS ===
      - --entrypoints.web.http.redirections.entryPoint.to=websecure
      - --entrypoints.web.http.redirections.entryPoint.scheme=https
      - --entrypoints.web.http.redirections.entryPoint.permanent=true

      # === Let's Encrypt ===
      # IMPORTANTE: cambia el email al de un admin real de BARNA.
      - --certificatesresolvers.le.acme.email=admin@barna.edu.do
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.httpchallenge=true
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web

      # Para la PRIMERA prueba, descomenta para usar el servidor de staging
      # de Let's Encrypt y evitar el rate-limit (5 certs/semana por dominio):
      # - --certificatesresolvers.le.acme.caserver=https://acme-staging-v02.api.letsencrypt.org/directory

      # === Logs ===
      - --log.level=INFO
      - --accesslog=false

    ports:
      - target: 80
        published: 80
        mode: host
      - target: 443
        published: 443
        mode: host

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-letsencrypt:/letsencrypt

    networks:
      - vitalia-net

    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any

volumes:
  traefik-letsencrypt:

networks:
  vitalia-net:
    external: true
