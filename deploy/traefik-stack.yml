# Traefik · Reverse proxy HTTP para Docker Swarm
#
# Sólo escucha en host:80 y descubre servicios por labels. Cloudflare hace
# la terminación TLS (modo Flexible o Full) y conecta a origen por HTTP.
#
# Deploy:
#   docker stack deploy -c deploy/traefik-stack.yml traefik

services:
  traefik:
    image: traefik:v3.1
    command:
      # Provider Swarm
      - --providers.swarm=true
      - --providers.swarm.exposedByDefault=false
      - --providers.swarm.network=vitalia-net

      # Único entrypoint: HTTP en el 80 (Cloudflare hace el TLS por delante)
      - --entrypoints.web.address=:80

      # Logs
      - --log.level=INFO
      - --accesslog=false

    ports:
      - target: 80
        published: 80
        mode: host

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

    networks:
      - vitalia-net

    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any

networks:
  vitalia-net:
    external: true
