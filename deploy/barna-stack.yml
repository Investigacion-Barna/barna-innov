# Diagnóstico de Cultura de Innovación · BARNA
# Stack para Docker Swarm con routing por Traefik.
#
# Pre-requisitos:
#   1. Red 'vitalia-net' existente (la misma que ya usa vitalia)
#   2. Stack 'traefik' desplegado y corriendo
#   3. Imagen 'barna-innov:latest' construida en el nodo (o en registry)
#   4. DNS: innovado.barna.edu.do → IP del servidor
#
# Deploy:
#   docker build -t barna-innov:latest .
#   docker stack deploy -c deploy/barna-stack.yml innovado

services:
  web:
    image: barna-innov:latest
    networks:
      - vitalia-net
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      labels:
        # Habilitar descubrimiento por Traefik
        - traefik.enable=true
        - traefik.swarm.network=vitalia-net

        # Router HTTP para innovado.barna.edu.do (Cloudflare hace el TLS).
        # Se incluye Host(`10.50.230.30`) para que los healthchecks que el
        # frontal de BARNA hace con Host=IP-interna respondan 200 y el
        # backend siga marcado como UP.
        - "traefik.http.routers.innovado.rule=Host(`innovado.barna.edu.do`) || Host(`10.50.230.30`)"
        - traefik.http.routers.innovado.entrypoints=web

        # Puerto interno del contenedor (nginx expone 80)
        - traefik.http.services.innovado.loadbalancer.server.port=80

networks:
  vitalia-net:
    external: true
